<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers | VaultofCodes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="w-full bg-slate-950/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="about.html" class="text-xl font-bold text-white flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-blue-500"></span> VaultofCodes
            </a>
            <div class="flex gap-6 text-sm font-medium">
                <a href="about.html" class="hover:text-blue-400 transition">About Us</a>
                <a href="careers.html" class="text-blue-400">Careers</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header class="py-16 px-6 text-center max-w-4xl mx-auto">
        <h1 class="text-4xl font-extrabold text-white">Build Your Career With Us</h1>
        <p class="mt-3 text-slate-400">Join our dynamic team and help shape the future of practical tech education.</p>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-6 pb-20 flex-grow w-full">
        
        <!-- Controls: Tabs & Search/Filter -->
        <div class="space-y-4 mb-8">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <!-- Category Tabs -->
                <div class="flex p-1 bg-slate-900 border border-slate-800 rounded-xl" id="typeTabs">
                    <button data-type="All" class="px-4 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white tab-btn">All</button>
                    <button data-type="Job" class="px-4 py-2 text-sm font-semibold text-slate-400 hover:text-white tab-btn">Jobs</button>
                    <button data-type="Internship" class="px-4 py-2 text-sm font-semibold text-slate-400 hover:text-white tab-btn">Internships</button>
                </div>
                
                <!-- Search Box -->
                <input type="text" id="searchInput" placeholder="Search title, skills..." class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 w-full sm:w-64">
            </div>

            <!-- Additional Filters -->
            <div class="flex flex-wrap gap-4">
                <select id="modeFilter" class="bg-slate-900 border border-slate-800 text-slate-300 rounded-xl px-3 py-2 text-sm">
                    <option value="">All Modes</option>
                    <option value="Remote">Remote</option>
                    <option value="Onsite">Onsite</option>
                    <option value="Hybrid">Hybrid</option>
                </select>
            </div>
        </div>

        <!-- Dynamic Container for Job Cards / States -->
        <div id="jobsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    </main>

    <!-- Modal for Opportunity Details -->
    <div id="detailsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 relative">
            <button id="closeModal" class="absolute top-4 right-4 text-slate-400 hover:text-white">&times;</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <footer class="py-8 border-t border-slate-800 text-center text-slate-500 text-sm">
        &copy; 2026 VaultofCodes. All rights reserved.
    </footer>

    <!-- Integration Logic -->
    <script>
        // Replace with your Google Apps Script Web App URL or Published Sheet JSON endpoint
        const API_URL = "https://script.google.com/macros/s/AKfycbzH3mgFeG1W_hOIHDTVX_H9EJdW_EZ6rdjcNuEvV4xxM3x5qajYITmuiSEKSokZnS2o-w/exec";

        let opportunities = [];
        let currentType = "All";

        const jobsGrid = document.getElementById("jobsGrid");
        const searchInput = document.getElementById("searchInput");
        const modeFilter = document.getElementById("modeFilter");

        // Fetch Data on Load
        async function fetchOpportunities() {
            renderLoadingState();
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                const data = await response.json();
                
                // Filter only 'Active' status opportunities
                opportunities = data.filter(item => String(item.Status).trim().toLowerCase() === 'active');
                renderListings();
            } catch (error) {
                renderErrorState();
            }
        }

        // Render Cards
        function renderListings() {
            const query = searchInput.value.toLowerCase();
            const selectedMode = modeFilter.value;

            const filtered = opportunities.filter(item => {
                const matchesType = currentType === "All" || item.Type === currentType;
                const matchesSearch = item.Title?.toLowerCase().includes(query) || item.Skills?.toLowerCase().includes(query);
                const matchesMode = !selectedMode || item.Mode === selectedMode;
                return matchesType && matchesSearch && matchesMode;
            });

            if (filtered.length === 0) {
                renderEmptyState();
                return;
            }

            jobsGrid.innerHTML = filtered.map((op, idx) => `
                <div class="bg-slate-900 border border-slate-800 hover:border-blue-500/50 transition rounded-2xl p-6 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-md ${op.Type === 'Internship' ? 'bg-purple-500/10 text-purple-400 border border-purple-500/20' : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'}">${op.Type}</span>
                            <span class="text-xs text-slate-400">${op.Mode}</span>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-1">${op.Title}</h3>
                        <p class="text-xs text-slate-400 mb-4">${op.Department} • ${op.Location}</p>
                        <p class="text-sm text-slate-300 line-clamp-2 mb-4">${op.Description || 'No description provided.'}</p>
                    </div>
                    <div>
                        <div class="flex flex-wrap gap-1 mb-4">
                            ${(op.Skills || '').split(',').map(s => `<span class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded">${s.trim()}</span>`).join('')}
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="openModal(${idx})" class="w-1/2 py-2 text-xs font-medium bg-slate-800 hover:bg-slate-700 rounded-xl transition text-slate-200">Details</button>
                            <a href="${op.ApplyLink}" target="_blank" class="w-1/2 py-2 text-xs font-medium bg-blue-600 hover:bg-blue-500 text-center rounded-xl transition text-white">Apply Now</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // State Helpers
        function renderLoadingState() {
            jobsGrid.innerHTML = `
                <div class="col-span-full py-16 text-center">
                    <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    <p class="text-slate-400 text-sm">Fetching live opportunities...</p>
                </div>`;
        }

        function renderEmptyState() {
            jobsGrid.innerHTML = `
                <div class="col-span-full py-16 text-center">
                    <p class="text-slate-300 text-lg font-medium">No opportunities currently available.</p>
                    <p class="text-slate-500 text-sm mt-1">Please adjust your search terms or check back later.</p>
                </div>`;
        }

        function renderErrorState() {
            jobsGrid.innerHTML = `
                <div class="col-span-full py-16 text-center">
                    <p class="text-red-400 font-medium">We're unable to load current opportunities.</p>
                    <p class="text-slate-500 text-sm mt-1">Please try again later or contact support.</p>
                </div>`;
        }

        // Modal Handler
        function openModal(index) {
            const op = opportunities[index];
            const modal = document.getElementById("detailsModal");
            document.getElementById("modalContent").innerHTML = `
                <h2 class="text-xl font-bold text-white mb-2">${op.Title}</h2>
                <p class="text-xs text-blue-400 mb-4">${op.Type} | ${op.Department} | ${op.Location} (${op.Mode})</p>
                <div class="space-y-3 text-sm text-slate-300 mb-6">
                    <p><strong>Duration / Commitment:</strong> ${op.Duration || 'N/A'}</p>
                    <p><strong>Required Skills:</strong> ${op.Skills}</p>
                    <p><strong>Application Deadline:</strong> ${op.Deadline || 'Open until filled'}</p>
                    <div class="pt-2 border-t border-slate-800">
                        <p class="text-xs text-slate-400 mb-1">Description:</p>
                        <p class="text-sm leading-relaxed">${op.Description}</p>
                    </div>
                </div>
                <a href="${op.ApplyLink}" target="_blank" class="block w-full py-2.5 text-center text-sm font-semibold bg-blue-600 hover:bg-blue-500 rounded-xl text-white">Apply Now</a>
            `;
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        document.getElementById("closeModal").onclick = () => {
            const modal = document.getElementById("detailsModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        };

        // Event Listeners
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                document.querySelectorAll(".tab-btn").forEach(b => {
                    b.classList.remove("bg-blue-600", "text-white");
                    b.classList.add("text-slate-400");
                });
                e.target.classList.add("bg-blue-600", "text-white");
                e.target.classList.remove("text-slate-400");
                currentType = e.target.getAttribute("data-type");
                renderListings();
            });
        });

        searchInput.addEventListener("input", renderListings);
        modeFilter.addEventListener("change", renderListings);

        // Initialize
        fetchOpportunities();
    </script>
</body>
</html>
